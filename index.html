<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AS Latin Vocabulary</title>
<style>
:root{
  --navy:#003968; --navy-lt:#1b5285; --red:#c91235; --red-dk:#a50e2b;
  --ink:#12202e; --muted:#5c6f80; --line:#d8e0e7; --bg:#f4f6f8; --card:#ffffff;
  --ok:#1c7a4b; --ok-bg:#e8f5ee; --bad:#b3122f; --bad-bg:#fdeced; --warn:#8a5a00; --warn-bg:#fdf3e0;
  --r:10px; --shadow:0 1px 2px rgba(0,40,80,.06),0 6px 18px rgba(0,40,80,.07);
  --body:"Gill Sans MT","Gill Sans",Calibri,"Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.04em}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}

/* header */
header{background:var(--navy);color:#fff;padding:18px 0 16px;border-bottom:4px solid var(--red)}
header .wrap{padding-bottom:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;text-transform:uppercase;letter-spacing:.14em}
header .sub{font-size:14px;color:#b9d0e4;letter-spacing:.02em}
header .spacer{flex:1}
header .nav{display:flex;gap:8px}
header button.link{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit}
header button.link:hover{background:rgba(255,255,255,.12)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:18px 0;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--navy);margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
select,input[type=text],input[type=number]{font-family:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
select:focus,input:focus{outline:2px solid var(--navy-lt);outline-offset:1px;border-color:var(--navy-lt)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1 1 180px;min-width:0}
button{font-family:inherit}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:12px 22px;font-size:16px;cursor:pointer;letter-spacing:.03em}
.btn:hover{background:var(--navy-lt)}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dk)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:#eef3f7}
.btn.sm{padding:7px 13px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted);font-size:14px}
.hidden{display:none!important}

/* mode picker */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
.mode{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:.12s}
.mode:hover{border-color:var(--navy-lt);transform:translateY(-1px);box-shadow:var(--shadow)}
.mode[aria-pressed=true]{border-color:var(--navy);background:#eef4f9;box-shadow:inset 0 0 0 1px var(--navy)}
.mode .n{display:inline-block;background:var(--navy);color:#fff;font-size:11px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;margin-right:8px}
.mode .t{font-weight:600;font-size:15px;letter-spacing:.02em}
.mode .d{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}

/* test chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;width:44px;text-align:center;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.done::after{content:"";display:block;height:3px;background:var(--red);margin:3px 8px -3px;border-radius:2px}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.qtag{background:#eef4f9;color:var(--navy);border-radius:5px;padding:3px 8px;font-size:11px;letter-spacing:.08em}
.qtag.inter{background:#fdf0e2;color:#8a5a00}
.prompt{font-size:29px;line-height:1.25;margin:12px 0 4px;font-weight:600}
.prompt.en{font-size:25px;font-weight:500}
.sub{font-size:15px;color:var(--muted);margin-bottom:14px}
.bar{height:5px;background:#e4eaef;border-radius:3px;overflow:hidden;margin-bottom:2px}
.bar>i{display:block;height:100%;background:var(--navy);transition:width .25s}
.fb{border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bfe3d0}
.fb.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c9cf}
.fb.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f0dcb4}
.fb b{font-weight:600}
.fb .alt{display:block;margin-top:6px;color:var(--ink);font-size:14px}
.flag{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.flag:hover{color:var(--red)}

/* flashcards */
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;padding:26px 12px}
.flash .front{font-size:36px;font-weight:600}
.flash .parts{font-size:17px;color:var(--muted);margin-top:6px;font-style:italic}
.flash .back{font-size:23px;color:var(--navy);margin-top:16px;padding-top:16px;border-top:1px solid var(--line);width:100%;max-width:520px}
.flash .hint{font-size:13px;color:var(--muted);margin-top:16px;letter-spacing:.06em;text-transform:uppercase}

/* parse grid */
.parse{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}

/* results */
.score{font-size:52px;font-weight:600;color:var(--navy);line-height:1}
.score small{font-size:19px;color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
td.lat{font-weight:600;white-space:nowrap}
code.codebox{display:block;background:#eef4f9;border:1px dashed var(--navy-lt);border-radius:8px;padding:12px;font-size:15px;word-break:break-all;color:var(--navy);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:8px}

/* print sheet */
.sheet{background:#fff;padding:26px;border:1px solid var(--line);border-radius:var(--r)}
.sheet h3{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--navy)}
.sheet .meta{font-size:13px;color:var(--muted);margin:4px 0 16px}
.sheet ol{margin:0;padding-left:26px}
.sheet li{padding:5px 0;border-bottom:1px dotted #c9d3db}
.sheet .ans{color:var(--red)}
@media print{
  body{background:#fff;font-size:12pt}
  header,.noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .sheet{border:none;padding:0;border-radius:0}
  .sheet li{break-inside:avoid}
  .cols{column-count:2;column-gap:30px}
}
@media (max-width:560px){
  header .wrap{gap:6px}header h1{font-size:17px}header .sub{width:100%;margin-top:-2px}
  .prompt{font-size:24px}.flash .front{font-size:30px}.score{font-size:42px}
  .chip{width:40px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>AS Latin Vocabulary</h1>
    <span class="sub">Tests 1&ndash;24 &middot; Eastbourne College</span>
    <span class="spacer"></span>
    <nav class="nav">
      <button class="link" id="navHome">Home</button>
      <button class="link" id="navPrint">Print a test</button>
      <button class="link" id="navTeacher">Teacher</button>
    </nav>
  </div>
</header>

<div class="wrap">

<!-- ============ HOME ============ -->
<section id="home">
  <div class="card">
    <h2>1 &middot; Choose your test</h2>
    <div class="chips" id="testChips"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost sm" id="selOne">Just one</button>
      <button class="btn ghost sm" id="selCumulative">Everything up to here</button>
      <button class="btn ghost sm" id="selAll">All 24</button>
    </div>
    <p class="muted" id="poolInfo" style="margin:12px 0 0"></p>
  </div>

  <div class="card">
    <h2>2 &middot; Choose your activity</h2>
    <div class="modes" id="modeGrid"></div>
  </div>

  <div class="card">
    <h2>3 &middot; Settings</h2>
    <div class="row">
      <div>
        <label for="qCount">Number of questions</label>
        <select id="qCount"><option>10</option><option selected>20</option><option>30</option><option>40</option><option value="0">All of them</option></select>
      </div>
      <div>
        <label for="interleave">Interleaving from earlier tests</label>
        <select id="interleave">
          <option value="0">None</option>
          <option value="0.2" selected>A fifth of questions</option>
          <option value="0.33">A third of questions</option>
          <option value="0.5">Half and half</option>
        </select>
      </div>
      <div>
        <label for="pupil">Your name (for the score code)</label>
        <input type="text" id="pupil" placeholder="e.g. A. Smith" autocomplete="name">
      </div>
    </div>
    <p class="muted" id="interNote" style="margin:12px 0 0"></p>
  </div>

  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="btn red" id="start" style="font-size:18px;padding:14px 34px">Start</button>
    <span class="muted" id="startHint"></span>
  </div>
</section>

<!-- ============ SESSION ============ -->
<section id="session" class="hidden">
  <div class="bar"><i id="progBar" style="width:0"></i></div>
  <div class="card" id="qcard"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn ghost sm" id="quit">End and see results</button>
    <span class="muted" id="runScore"></span>
  </div>
</section>

<!-- ============ RESULTS ============ -->
<section id="results" class="hidden"></section>

<!-- ============ PRINT ============ -->
<section id="print" class="hidden">
  <div class="card noprint">
    <h2>Printable test</h2>
    <div class="row">
      <div>
        <label for="pTest">Test</label>
        <select id="pTest"></select>
      </div>
      <div>
        <label for="pCount">How many words</label>
        <select id="pCount"><option>10</option><option>15</option><option selected>20</option><option>25</option><option value="0">All of them</option></select>
      </div>
      <div>
        <label for="pDir">Direction</label>
        <select id="pDir">
          <option value="le">Latin given, write the English</option>
          <option value="el">English given, write the Latin</option>
          <option value="parts">Latin given, write meaning and parts</option>
        </select>
      </div>
      <div>
        <label for="pInter">Interleaving</label>
        <select id="pInter"><option value="0">None</option><option value="0.25" selected>A quarter from earlier tests</option><option value="0.5">Half from earlier tests</option></select>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn sm" id="pGen">Generate</button>
      <button class="btn ghost sm" id="pKey">Show answer key</button>
      <button class="btn ghost sm" id="pPrint">Print</button>
    </div>
  </div>
  <div id="sheet"></div>
</section>

<!-- ============ TEACHER ============ -->
<section id="teacher" class="hidden"></section>

</div>

  if (!gen || !/^[a-z]+$/i.test(gen)) return null;

  if (pluralOnly) {
    let st = null, d = null;
    if (/arum$/.test(gen)) { st = gen.slice(0, -4); d = '1'; }
    else if (/orum$/.test(gen)) { st = gen.slice(0, -4); d = '2'; }
    else if (/ium$/.test(gen)) { st = gen.slice(0, -3); d = '3'; }
    else if (/um$/.test(gen)) { st = gen.slice(0, -2); d = '3'; }
    if (!st) return null;
    const g = gender || (d === '1' ? 'f' : 'm');
    return { decl: d, gen, gender: g, stem: st, istem: /ium$/.test(gen) ? (g === 'n' ? 'neut' : true) : false, lemma: w.l, pluralOnly: true };
  }

  const bySuffix = /ae$/.test(gen) ? '1' : /ei$/.test(gen) ? '5' : /us$/.test(gen) ? '4' : /is$/.test(gen) ? '3' : /i$/.test(gen) ? '2' : null;
  if (bySuffix && bySuffix !== decl) {

    if ((bySuffix === '1' && lemEndsA) || (bySuffix === '2' && lemEndsUsUmEr) || bySuffix === '4' || bySuffix === '5') decl = bySuffix;
  }

function nounParadigm(n) {
  const out = [];

    if (hit < 0) missing.push(w.label); else used.add(hit);
  }
  return { ok: missing.length === 0, close, missing };
}
/* principal parts / notes */
function checkNotes(given, notes) {
  const clean = s => M.norm(s.replace(/\(.*?\)/g, ' ').replace(/\+.*$/, ' '));
  const g = clean(given), w = clean(notes);
  if (!g) return { ok: false };
  if (g === w) return { ok: true };
  if (M.lev(g, w) <= 1) return { ok: true, close: true };
  /* allow the gender letter to be dropped from a noun's parts */
  const wNoGender = w.replace(/\b(m|f|n)\b/g, '').replace(/\s+/g, ' ').trim();
  if (g === wNoGender) return { ok: true, partial: 'gender' };
  return { ok: false };
}

/* ============================================================
   QUESTION GENERATORS
   ============================================================ */

/* --- 2. basic: meanings --- */
function qBasic(w) {
  if (!w.senses.length) return null;
  const many = w.senses.length > 1;
  return {
    type: 'text', word: w, kind: 'Meaning',
    prompt: w.l, promptClass: '',
    sub: many ? 'Give <b>all ' + w.senses.length + '</b> meanings, separated by commas. Order does not matter.' : 'Give the meaning.',
    check: g => checkAllMeanings(g, w.senses),
    show: w.senses.join(', '),
    extra: w.n ? '<i>' + esc(w.n) + '</i> &middot; ' + esc(w.p) : esc(w.p)
  };
}

/* --- 3. advanced: meanings + principal parts --- */
function qAdvanced(w) {
  if (!w.n || /indeclinable/i.test(w.n) || /^\s*\+/.test(w.n) || !/[a-z]{3}/i.test(w.n.replace(/\b(acc|abl|dat|gen|m|f|n|pl)\b/g, ''))) return qBasic(w);
  const isVerb = /^verb/.test(w.p);
  return {
    type: 'two', word: w, kind: 'Meaning and parts',
    prompt: w.l,
    sub: isVerb ? 'Give the remaining principal parts, then all the meanings.' : 'Give the rest of the dictionary entry, then all the meanings.',
    fields: [
      { label: isVerb ? 'Principal parts' : 'Genitive and gender', ph: isVerb ? 'e.g. agere, egi, actus' : 'e.g. militis, m', check: g => checkNotes(g, w.n), show: w.n },
      { label: 'Meaning' + (w.senses.length > 1 ? 's (all ' + w.senses.length + ')' : ''), ph: 'e.g. do, act, drive', check: g => checkAllMeanings(g, w.senses), show: w.senses.join(', ') }
    ],
    show: w.n + ' — ' + w.senses.join(', ')
  };
}

/* --- 4. super-advanced: forms --- */
const TENSES = ['present', 'imperfect', 'future', 'perfect', 'pluperfect', 'future perfect'];
const PERSON_LABEL = { '1sg': '1st singular', '2sg': '2nd singular', '3sg': '3rd singular', '1pl': '1st plural', '2pl': '2nd plural', '3pl': '3rd plural' };

function verbTranslateQ(w) {
  const v = w.verb; if (!v || v.impers) return null;
  const pd = M.verbParadigm(v).filter(x => x.mood === 'indicative' && TENSES.indexOf(x.tense) >= 0);
  if (!pd.length) return null;
  const cands = pd.filter(x => M.englishVerb(v, x));
  if (!cands.length) return null;
  const act = cands.filter(x => x.voice === 'active');
  const spec = (act.length && Math.random() < 0.78) ? pick(act) : pick(cands);
  const eng = M.expandPronouns(M.englishVerb(v, spec), spec.person);
  return {
    type: 'text', word: w, kind: 'Translate the form', form: spec.form,
    prompt: spec.form,
    sub: 'Translate this form into English.',
    check: g => checkText(g, eng),
    show: eng[0],
    extra: PERSON_LABEL[spec.person] + ' ' + spec.tense + ' ' + spec.voice + ' &middot; <b>' + esc(w.l) + '</b>, ' + esc(w.senses.join(', ')),
    flagKey: w.l + ' → ' + spec.form + ' (' + spec.tense + ' ' + spec.voice + ' ' + spec.person + ')'
  };
}

function verbParseQ(w) {
  const v = w.verb; if (!v) return null;
  const pd = M.verbParadigm(v);
  if (!pd.length) return null;
  const spec = pick(pd);
  /* every analysis that produces the same form is acceptable */
  const valid = pd.filter(x => x.form === spec.form);
  return {
    type: 'parse-verb', word: w, kind: 'Parse the form', form: spec.form,
    prompt: spec.form,
    sub: 'Give the person, number, tense, voice and mood. (<b>' + esc(w.l) + '</b>, ' + esc(w.senses[0] || '') + ')',
    valid,
    show: valid.map(x => PERSON_LABEL[x.person] + ', ' + x.tense + ', ' + x.voice + ', ' + x.mood).join('  /  '),
    flagKey: w.l + ' → ' + spec.form
  };
}

function nounParseQ(w) {
  const n = w.noun; if (!n) return null;
  const pd = M.nounParadigm(n);
  if (!pd.length) return null;
  const spec = pick(pd);
  const valid = pd.filter(x => x.form === spec.form);
  return {
    type: 'parse-noun', word: w, kind: 'Case and number', form: spec.form,
    prompt: spec.form,
    sub: 'Which case and number? (<b>' + esc(w.l) + '</b>, ' + esc(w.senses[0] || '') + ')',
    valid,
    show: valid.map(x => M.CASE_NAME[x.cs] + ' ' + M.NUM_NAME[x.num]).join('  /  '),
    flagKey: w.l + ' → ' + spec.form
  };
}

function nonFiniteQ(w) {
  const v = w.verb; if (!v) return null;
  const nf = M.verbNonFinite(v).filter(x => x.form && !/gerund/.test(x.label));
  if (nf.length < 2) return null;
  const spec = pick(nf);
  const distractors = sample(['present active infinitive', 'perfect active infinitive', 'present passive infinitive', 'perfect passive participle', 'present active participle', 'future active participle', 'imperative singular', 'imperative plural', 'gerundive'].filter(l => l !== spec.label), 3);
  return {
    type: 'choice', word: w, kind: 'Name the form', form: spec.form,
    prompt: spec.form,
    sub: 'What form is this? (<b>' + esc(w.l) + '</b>, ' + esc(w.senses[0] || '') + ')',
    options: shuffle([spec.label].concat(distractors)),
    answer: spec.label,
    show: spec.label,
    flagKey: w.l + ' → ' + spec.form
  };
}

function adjDegreeQ(w) {
  const a = w.adj; if (!a || !a.gradable) return null;
  const d = M.adjDegrees(a);
  const which = Math.random() < 0.5 ? 'comparative' : 'superlative';
  const eng = w.senses[0] || '';
  return {
    type: 'text', word: w, kind: 'Degree',
    prompt: w.l,
    sub: 'Give the <b>' + which + '</b> (masculine nominative singular).',
    check: g => checkText(g, [which === 'comparative' ? d.comp : d.sup]),
    show: which === 'comparative' ? d.comp : d.sup,
    extra: esc(eng) + ' &middot; comparative <b>' + d.comp + '</b>, superlative <b>' + d.sup + '</b>, adverb <b>' + M.adjAdverb(a) + '</b>',
    flagKey: w.l + ' ' + which
  };
}

function formsQuestion(w) {
  const gens = [];
  if (w.verb) { gens.push(verbTranslateQ, verbTranslateQ, verbParseQ, nonFiniteQ); }
  if (w.noun) { gens.push(nounParseQ, nounParseQ); }
  if (w.adj && w.adj.gradable) gens.push(adjDegreeQ);
  if (!gens.length) return null;
  for (const g of shuffle(gens)) { const q = g(w); if (q) return q; }
  return null;
}

/* --- 5. super-advanced squared: English into Latin --- */
function e2lVerbQ(w) {
  const v = w.verb; if (!v || v.impers) return null;
  const pd = M.verbParadigm(v).filter(x => x.mood === 'indicative' && TENSES.indexOf(x.tense) >= 0 && x.voice === 'active');
  const cands = pd.filter(x => M.englishVerb(v, x));
  if (!cands.length) return null;
  const spec = pick(cands);
  const eng = M.englishVerb(v, spec)[0];
  const syn = synonymsOf(w, w.senses[0], x => x.verb && !x.verb.impers);
  const accepted = [];
  syn.forEach(x => M.verbParadigm(x.verb)
    .filter(y => y.tense === spec.tense && y.person === spec.person && y.voice === spec.voice && y.mood === spec.mood)
    .forEach(y => accepted.push(y.form)));
  if (!accepted.length) accepted.push(spec.form);
  return {
    type: 'text', word: w, kind: 'English into Latin', latin: true,
    prompt: cap(eng), promptClass: 'en',
    sub: 'Put into Latin. (<b>' + esc(w.l) + '</b> &middot; ' + spec.tense + ', ' + PERSON_LABEL[spec.person] + ')',
    check: g => checkWords(g, accepted),
    show: spec.form,
    extra: alsoNote(accepted),
    flagKey: 'E2L ' + w.l + ' ' + spec.tense + ' ' + spec.person
  };
}

function nounSlot(w, cs, num) {
  const syn = synonymsOf(w, w.senses[0], x => x.noun && !(x.noun.pluralOnly && num === 'sg'));
  const out = [];
  syn.forEach(x => { const f = M.nounForm(x.noun, cs, num); if (f) f.forEach(y => { if (y && out.indexOf(y) < 0) out.push(y); }); });
  return out.length ? out : [];
}

function e2lNounQ(w) {
  const n = w.noun; if (!n) return null;
  const pd = M.nounParadigm(n).filter(x => x.cs !== 'nom');
  if (!pd.length) return null;
  const spec = pick(pd);
  const accepted = nounSlot(w, spec.cs, spec.num);
  return {
    type: 'text', word: w, kind: 'English into Latin', latin: true,
    prompt: cap(M.englishNoun(w.m, spec.cs, spec.num)), promptClass: 'en',
    sub: 'Put into Latin. (<b>' + esc(w.l) + ', ' + esc(w.n) + '</b> &middot; ' + M.CASE_NAME[spec.cs] + ' ' + M.NUM_NAME[spec.num] + ')',
    check: g => checkWords(g, accepted),
    show: (spec.alts && spec.alts.length ? spec.alts : [spec.form]).join(' / '),
    extra: alsoNote(accepted),
    flagKey: 'E2L ' + w.l + ' ' + spec.cs + spec.num
  };
}

function e2lPhraseQ(w, pool) {
  const n = w.noun; if (!n) return null;
  const adjs = pool.filter(x => x.adj && !x.adj.pluralOnly && x.senses.length && M.GRADABLE.has(x.adj.lemma));
  if (!adjs.length) return null;
  const a = pick(adjs);
  const num = n.pluralOnly ? 'pl' : pick(['sg', 'pl']);
  const cs = pick(['nom', 'acc', 'gen', 'dat', 'abl']);
  const nf = M.nounForm(n, cs, num); if (!nf || !nf[0]) return null;
  const af = M.adjForm(a.adj, cs, num, n.gender); if (!af) return null;
  const adjEng = (a.senses[0] || '').split('(')[0].trim();
  const nounEng = M.englishNoun(w.m, cs, num);
  const eng = nounEng.replace(/\bthe\b/, 'the ' + adjEng);
  const nounForms = nounSlot(w, cs, num).length ? nounSlot(w, cs, num) : nf;
  const adjSyn = synonymsOf(a, adjEng, x => x.adj && !x.adj.pluralOnly);
  const adjForms = [];
  adjSyn.forEach(x => { const f = M.adjForm(x.adj, cs, num, n.gender); if (f && adjForms.indexOf(f) < 0) adjForms.push(f); });
  const accepted = [];
  for (const form of nounForms) for (const aj of adjForms) { accepted.push(aj + ' ' + form); accepted.push(form + ' ' + aj); }
  return {
    type: 'text', word: w, kind: 'English into Latin', latin: true,
    prompt: cap(eng), promptClass: 'en',
    sub: 'Put into Latin, making the adjective agree. (<b>' + esc(w.l) + '</b> &middot; <b>' + esc(a.l) + '</b> &middot; ' + M.CASE_NAME[cs] + ' ' + M.NUM_NAME[num] + ')',
    check: g => checkWords(g, accepted),
    show: af + ' ' + nf[0],
    flagKey: 'E2L phrase ' + a.l + ' + ' + w.l + ' ' + cs + num
  };
}

function e2lPrepQ(w, pool) {
  const preps = pool.filter(x => /prep/.test(x.p) && /\+\s*(acc|abl)/.test(x.n || ''));
  const nouns = pool.filter(x => x.noun && /^[a-z-]+$/i.test((x.senses[0] || '').trim()));
  if (!preps.length || !nouns.length) return null;
  const p = pick(preps);
  const n = pick(nouns);
  const cs = /acc/.test(p.n) ? 'acc' : 'abl';
  const num = n.noun.pluralOnly ? 'pl' : pick(['sg', 'pl']);
  const nf = M.nounForm(n.noun, cs, num); if (!nf || !nf[0]) return null;
  const prepEng = (p.senses[0] || '').trim();
  const nounEng = M.englishNoun(n.m, 'nom', num);
  const prepSyn = synonymsOf(p, prepEng, x => /prep/.test(x.p) && new RegExp(cs).test(x.n || ''));
  const nounForms = nounSlot(n, cs, num).length ? nounSlot(n, cs, num) : nf;
  const accepted = [];
  prepSyn.forEach(pp => nounForms.forEach(f => accepted.push(pp.l + ' ' + f)));
  return {
    type: 'text', word: n, kind: 'English into Latin', latin: true,
    prompt: cap(prepEng + ' ' + nounEng), promptClass: 'en',
    sub: 'Put into Latin. (<b>' + esc(p.l) + '</b> takes the ' + M.CASE_NAME[cs] + ' &middot; <b>' + esc(n.l) + ', ' + esc(n.n) + '</b>)',
    check: g => checkWords(g, accepted),
    show: accepted[0],
    flagKey: 'E2L prep ' + p.l + ' + ' + n.l
  };
}

function e2lSentenceQ(pool) {
  const subs = pool.filter(x => x.noun && !x.noun.pluralOnly && ANIMATE.test(x.m));
  const verbs = pool.filter(x => x.verb && x.verb.kind === 'reg' && !x.verb.impers && !/\+/.test(x.n || '') && x.senses.length);
  if (!subs.length || !verbs.length) return null;
  const s = pick(subs), v = pick(verbs);
  const num = pick(['sg', 'pl']);
  const person = num === 'sg' ? '3sg' : '3pl';
  const pd = M.verbParadigm(v.verb).filter(x => x.mood === 'indicative' && x.voice === 'active' && x.person === person && TENSES.indexOf(x.tense) >= 0);
  if (!pd.length) return null;
  const spec = pick(pd);
  const vEng = M.englishVerb(v.verb, spec); if (!vEng) return null;
  const sf = M.nounForm(s.noun, 'nom', num); if (!sf || !sf[0]) return null;
  const sEng = M.englishNoun(s.m, 'nom', num);
  /* strip the pronoun off the English verb phrase and attach the subject */
  const vp = vEng[0].replace(/^(he|she|it|they)\s+/, '');
  /* each slot may be filled by any word of the list that carries the same sense */
  const slots = [];
  slots.push(nounSlot(s, 'nom', num).length ? nounSlot(s, 'nom', num) : [sf[0]]);
  const vSyn = synonymsOf(v, v.senses[0], x => x.verb && !x.verb.impers);
  const vForms = [];
  vSyn.forEach(x => M.verbParadigm(x.verb)
    .filter(y => y.tense === spec.tense && y.person === spec.person && y.voice === 'active' && y.mood === 'indicative')
    .forEach(y => { if (vForms.indexOf(y.form) < 0) vForms.push(y.form); }));
  slots.push(vForms.length ? vForms : [spec.form]);
  const words = [sf[0], spec.form];
  let objBit = '';
  const objs = pool.filter(x => x.noun && !ANIMATE.test(x.m) && x.noun.gender !== undefined);
  if (v.verb.suppStem && objs.length && Math.random() < 0.5) {
    const o = pick(objs);
    const onum = o.noun.pluralOnly ? 'pl' : pick(['sg', 'pl']);
    const of_ = M.nounForm(o.noun, 'acc', onum);
    if (of_ && of_[0]) {
      words.push(of_[0]); objBit = ' ' + M.englishNoun(o.m, 'acc', onum);
      slots.push(nounSlot(o, 'acc', onum).length ? nounSlot(o, 'acc', onum) : [of_[0]]);
    }
  }
  const eng = sEng + ' ' + vp + objBit;
  const accepted = [];
  combinations(slots).forEach(combo => permutations(combo).forEach(a => accepted.push(a.join(' '))));
  return {
    type: 'text', word: v, kind: 'English into Latin', latin: true,
    prompt: cap(eng) + '.', promptClass: 'en',
    sub: 'Put the sentence into Latin. Word order is free. (' + spec.tense + ')',
    check: g => checkWords(g, accepted),
    show: words.join(' '),
    flagKey: 'E2L sentence ' + s.l + ' ' + v.l
  };
}
function combinations(slots) {
  let out = [[]];
  for (const opts of slots) {
    const next = [];
    for (const base of out) for (const o of opts.slice(0, 4)) { if (next.length < 120) next.push(base.concat([o])); }
    out = next;
  }
  return out;
}
function permutations(a) {
  if (a.length <= 1) return [a];
  const out = [];
  for (let i = 0; i < a.length; i++) {
    const rest = a.slice(0, i).concat(a.slice(i + 1));
    for (const p of permutations(rest)) out.push([a[i]].concat(p));
  }
  return out;
}

function e2lQuestion(w, pool) {
  const gens = [];
  if (w.verb) gens.push(e2lVerbQ, e2lVerbQ);
  if (w.noun) gens.push(e2lNounQ, x => e2lPhraseQ(x, pool));
  gens.push(() => e2lPrepQ(w, pool));
  gens.push(() => e2lSentenceQ(pool));
  for (const g of shuffle(gens)) { const q = g(w, pool); if (q) return q; }
  return null;
}

/* --- 1. flashcards --- */
function qFlash(w, reverse) {
  return {
    type: 'flash', word: w, kind: 'Flashcard',
    front: reverse ? w.senses.join(', ') : w.l,
    parts: reverse ? '' : (w.n && !/indeclinable/i.test(w.n) ? w.n : '') + (w.p ? '  ·  ' + w.p : ''),
    back: reverse ? w.l + (w.n && !/indeclinable/i.test(w.n) ? '  (' + w.n + ')' : '') : w.senses.join(', ')
  };
}

/* ============================================================
   BUILDING A SESSION
   ============================================================ */
const MODES = [
  { id: 'flash', n: 1, t: 'Flashcards', d: 'Latin one side, meanings and parts the other. Rate yourself; anything you miss comes round again.' },
  { id: 'basic', n: 2, t: 'Basic test', d: 'What must be known: every meaning of the word, given in any order.' },
  { id: 'advanced', n: 3, t: 'Advanced test', d: 'Meanings plus the principal parts, genitive and gender.' },
  { id: 'forms', n: 4, t: 'Forms', d: 'Translate and parse real forms: tulit, militibus, acerrimus.' },
  { id: 'e2l', n: 5, t: 'English into Latin', d: 'Forms, agreeing phrases and short sentences, from English.' },
  { id: 'mixed', n: 6, t: 'Consolidation', d: 'Everything mixed, weighted towards words you have got wrong before.' }
];

let state = null;

function poolFor(tests) {
  const set = new Set(tests);
  return WORDS.filter(w => set.has(w.test));
}
function hasForms(w) { return !!(w.verb || w.noun || (w.adj && w.adj.gradable)); }
function modeFilter(mode, arr) {
  if (mode === 'forms' || mode === 'e2l') {
    const f = arr.filter(hasForms);
    return f.length >= 6 ? f : arr;
  }
  return arr;
}
function earlierPool(tests) {
  const lo = Math.min.apply(null, tests);
  return WORDS.filter(w => w.test < lo);
}

function buildQuestions(mode, tests, count, interRatio) {
  const main = modeFilter(mode, poolFor(tests));
  const earlier = modeFilter(mode, earlierPool(tests));
  const nInter = earlier.length ? Math.round(count * interRatio) : 0;
  const nMain = count - nInter;

  const weighted = (arr, k) => {
    const scored = arr.map(w => ({ w, s: Math.random() + weakness(w.id) * 0.9 }));
    scored.sort((a, b) => b.s - a.s);
    return scored.slice(0, k).map(x => x.w);
  };

  const chosen = [];
  const mainPick = mode === 'mixed' ? weighted(main, nMain) : sample(main, nMain);
  mainPick.forEach(w => chosen.push({ w, inter: false }));
  if (nInter) weighted(earlier, nInter).forEach(w => chosen.push({ w, inter: true }));

  const pool = poolFor(tests).concat(earlierPool(tests));
  const out = [];
  for (const c of shuffle(chosen)) {
    let q = null, m = mode;
    if (mode === 'mixed') m = pick(['basic', 'basic', 'advanced', 'forms', 'e2l']);
    if (m === 'flash') q = qFlash(c.w, false);
    else if (m === 'basic') q = qBasic(c.w);
    else if (m === 'advanced') q = qAdvanced(c.w);
    else if (m === 'forms') q = formsQuestion(c.w) || qBasic(c.w);
    else if (m === 'e2l') q = e2lQuestion(c.w, pool) || qBasic(c.w);
    if (!q) q = qBasic(c.w);
    if (!q) continue;
    q.inter = c.inter;
    out.push(q);
  }
  return out;
}

/* ============================================================
   UI
   ============================================================ */
let selected = new Set([1]);
let mode = 'basic';

function renderChips() {
  const box = $('#testChips'); box.innerHTML = '';
  TESTS.forEach(t => {
    const b = el('button', 'chip', String(t));
    b.setAttribute('aria-pressed', selected.has(t));
    if (store.done[t]) b.classList.add('done');
    b.onclick = () => {
      if (selected.has(t)) { if (selected.size > 1) selected.delete(t); }
      else selected.add(t);
      renderChips(); updateInfo();
    };
    box.appendChild(b);
  });
}
function renderModes() {
  const box = $('#modeGrid'); box.innerHTML = '';
  MODES.forEach(m => {
    const b = el('button', 'mode');
    b.setAttribute('aria-pressed', m.id === mode);
    b.innerHTML = '<div><span class="n">' + m.n + '</span><span class="t">' + m.t + '</span></div><div class="d">' + m.d + '</div>';
    b.onclick = () => { mode = m.id; renderModes(); updateInfo(); };
    box.appendChild(b);
  });
}
function updateInfo() {
  const tests = [...selected].sort((a, b) => a - b);
  const pool = poolFor(tests);
  $('#poolInfo').innerHTML = '<b>' + pool.length + '</b> words selected from test' + (tests.length > 1 ? 's ' : ' ') + rangeText(tests) + '.';
  const earlier = earlierPool(tests);
  $('#interNote').innerHTML = earlier.length
    ? 'Interleaved questions are drawn from the ' + earlier.length + ' words in tests 1&ndash;' + (Math.min.apply(null, tests) - 1) + ', weighted towards ones you have got wrong before.'
    : 'Nothing earlier to interleave from yet &mdash; pick a later test to switch this on.';
  $('#startHint').textContent = MODES.find(m => m.id === mode).t + ' · ' + rangeText(tests);
}
function rangeText(tests) {
  if (tests.length === 1) return String(tests[0]);
  let runs = [], start = tests[0], prev = tests[0];
  for (let i = 1; i <= tests.length; i++) {
    if (tests[i] === prev + 1) { prev = tests[i]; continue; }
    runs.push(start === prev ? String(start) : start + '–' + prev);
    start = prev = tests[i];
  }
  return runs.join(', ');
}

/* ---------- session ---------- */
function startSession() {
  const tests = [...selected].sort((a, b) => a - b);
  let count = parseInt($('#qCount').value, 10);
  const inter = parseFloat($('#interleave').value);
  const poolSize = poolFor(tests).length;
  if (!count) count = poolSize;
  count = Math.min(count, poolSize + Math.round(poolSize * inter));
  const qs = buildQuestions(mode, tests, count, inter);
  if (!qs.length) return;
  state = { qs, i: 0, right: 0, wrong: [], tests, mode, again: [], claimed: 0, pupil: $('#pupil').value.trim() };
  store.settings = { count: $('#qCount').value, inter: $('#interleave').value, pupil: state.pupil };
  tests.forEach(t => store.done[t] = true);
  save();
  show('session');
  renderQuestion();
}

function show(which) {
  ['home', 'session', 'results', 'print', 'teacher'].forEach(id => $('#' + id).classList.toggle('hidden', id !== which));
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const s = state;
  if (s.i >= s.qs.length) { if (s.again.length) { s.qs = s.qs.concat(s.again); s.again = []; } else return finish(); }
  const q = s.qs[s.i];
  $('#progBar').style.width = (100 * s.i / s.qs.length) + '%';
  $('#runScore').textContent = s.i > 0 ? s.right + ' of ' + s.i + ' so far' : '';
  const c = $('#qcard'); c.innerHTML = '';

  const head = el('div', 'qhead');
  head.innerHTML = '<span>Question ' + (s.i + 1) + ' of ' + s.qs.length + '</span>' +
    '<span class="qtag' + (q.inter ? ' inter' : '') + '">' + (q.inter ? 'Revision &middot; test ' + q.word.test : q.kind) + '</span>';
  c.appendChild(head);

  if (q.type === 'flash') return renderFlash(c, q);

  c.appendChild(el('div', 'prompt ' + (q.promptClass || ''), esc(q.prompt)));
  if (q.sub) c.appendChild(el('div', 'sub', q.sub));

  const form = el('form');
  let inputs = [];
  if (q.type === 'text') {
    const inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false;
    inp.placeholder = q.latin ? 'Type the Latin' : 'Type your answer';
    form.appendChild(inp); inputs = [inp];
  } else if (q.type === 'two') {
    q.fields.forEach(f => {
      const d = el('div'); d.style.marginBottom = '10px';
      d.appendChild(el('label', null, f.label));
      const inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.placeholder = f.ph;
      d.appendChild(inp); form.appendChild(d); inputs.push(inp);
    });
  } else if (q.type === 'parse-verb') {
    const g = el('div', 'parse');
    inputs = [
      selectOf(g, 'Person & number', ['1sg', '2sg', '3sg', '1pl', '2pl', '3pl'], PERSON_LABEL),
      selectOf(g, 'Tense', TENSES),
      selectOf(g, 'Voice', ['active', 'passive']),
      selectOf(g, 'Mood', ['indicative', 'subjunctive'])
    ];
    form.appendChild(g);
  } else if (q.type === 'parse-noun') {
    const g = el('div', 'parse');
    inputs = [selectOf(g, 'Case', M.CASES, M.CASE_NAME), selectOf(g, 'Number', ['sg', 'pl'], M.NUM_NAME)];
    form.appendChild(g);
  } else if (q.type === 'choice') {
    const g = el('div', 'parse');
    q.options.forEach(o => {
      const b = el('button', 'btn ghost sm', esc(o)); b.type = 'button';
      b.onclick = () => grade(q, [o]);
      g.appendChild(b);
    });
    form.appendChild(g);
  }

  if (q.type !== 'choice') {
    const bar = el('div'); bar.style.marginTop = '14px';
    const sub = el('button', 'btn', 'Check'); sub.type = 'submit';
    bar.appendChild(sub); form.appendChild(bar);
    form.onsubmit = e => { e.preventDefault(); grade(q, inputs.map(i => i.value)); };
  }
  c.appendChild(form);
  const first = form.querySelector('input,select'); if (first) first.focus();
}

function selectOf(parent, label, opts, names) {
  const d = el('div');
  d.appendChild(el('label', null, label));
  const sel = el('select');
  sel.appendChild(el('option', null, '&mdash;'));
  opts.forEach(o => { const op = el('option', null, names ? (names[o] || o) : o); op.value = o; sel.appendChild(op); });
  d.appendChild(sel); parent.appendChild(d);
  return sel;
}

function grade(q, vals) {
  const s = state;
  let res;
  if (q.type === 'text') res = q.check(vals[0]);
  else if (q.type === 'two') {
    const r = q.fields.map((f, i) => f.check(vals[i]));
    res = { ok: r.every(x => x.ok), close: r.some(x => x.close), parts: r };
  } else if (q.type === 'parse-verb') {
    const [p, t, v, m] = vals;
    res = { ok: q.valid.some(x => x.person === p && x.tense === t && x.voice === v && x.mood === m) };
  } else if (q.type === 'parse-noun') {
    const [c, n] = vals;
    res = { ok: q.valid.some(x => x.cs === c && x.num === n) };
  } else if (q.type === 'choice') {
    res = { ok: vals[0] === q.answer };
  }

  bump(q.word.id, res.ok);
  if (res.ok) s.right++; else { s.wrong.push(q); if (s.again.length < 6) s.again.push(q); }
  const typed = (q.type === 'text' || q.type === 'two') ? vals.filter(Boolean).join(' / ').trim() : '';

  const card = $('#qcard');
  card.querySelectorAll('form button,form input,form select').forEach(e => e.disabled = true);
  const fb = el('div', 'fb ' + (res.ok ? (res.close ? 'warn' : 'ok') : 'bad'));
  let msg = res.ok ? (res.close ? 'Right, but check your spelling.' : 'Correct.') : 'Not quite.';
  if (!res.ok && res.missing && res.missing.length) msg = 'Not everything &mdash; you missed ' + res.missing.map(x => '&ldquo;' + esc(x) + '&rdquo;').join(', ') + '.';
  fb.innerHTML = '<b>' + msg + '</b><span class="alt">' + esc(q.show) + '</span>' + (q.extra ? '<span class="alt muted">' + q.extra + '</span>' : '');
  card.appendChild(fb);

  const bar = el('div'); bar.style.marginTop = '14px'; bar.style.display = 'flex'; bar.style.gap = '10px'; bar.style.alignItems = 'center';
  const next = el('button', 'btn', s.i + 1 >= s.qs.length && !s.again.length ? 'See results' : 'Next');
  next.onclick = () => { s.i++; renderQuestion(); };
  bar.appendChild(next);
  if (!res.ok && typed) {
    const cl = el('button', 'flag', 'My answer could be right too');
    cl.onclick = () => {
      store.queries.push({ q: q.prompt, want: q.show, got: typed, w: q.word.l, t: q.word.test, m: MODES.find(x => x.id === s.mode).t, d: new Date().toISOString().slice(0, 10) });
      save();
      s.claimed = (s.claimed || 0) + 1;
      s.right++;
      const i = s.wrong.lastIndexOf(q); if (i >= 0) s.wrong.splice(i, 1);
      const j = s.again.lastIndexOf(q); if (j >= 0) s.again.splice(j, 1);
      bump(q.word.id, true);
      fb.className = 'fb warn';
      fb.innerHTML = '<b>Counted as right, and sent to your teacher to check.</b><span class="alt">You put <b>' + esc(typed) + '</b>; the answer expected was <b>' + esc(q.show) + '</b>.</span>';
      cl.remove();
      next.textContent = s.i + 1 >= s.qs.length && !s.again.length ? 'See results' : 'Next';
    };
    bar.appendChild(cl);
  }
  if (q.flagKey) {
    const fl = el('button', 'flag', 'This form looks wrong');
    fl.style.marginLeft = '4px';
    fl.onclick = () => { store.flags.push({ k: q.flagKey, w: q.word.l, t: q.word.test, d: new Date().toISOString().slice(0, 10) }); save(); fl.textContent = 'Flagged, thank you'; fl.disabled = true; };
    bar.appendChild(fl);
  }
  card.appendChild(bar);
  next.focus();
}

function renderFlash(c, q) {
  const s = state;
  const f = el('div', 'flash');
  let shown = false;
  const draw = () => {
    f.innerHTML = '<div class="front">' + esc(q.front) + '</div>' +
      (q.parts ? '<div class="parts">' + esc(q.parts) + '</div>' : '') +
      (shown ? '<div class="back">' + esc(q.back) + '</div>' : '<div class="hint">Tap, or press space, to turn over</div>');
  };
  draw();
  f.onclick = () => { if (!shown) { shown = true; draw(); rate.classList.remove('hidden'); } };
  c.appendChild(f);
  const rate = el('div', 'hidden');
  rate.style.display = 'flex'; rate.style.gap = '10px'; rate.style.marginTop = '14px'; rate.style.flexWrap = 'wrap';
  const good = el('button', 'btn', 'Knew it');
  const bad = el('button', 'btn ghost', 'Not yet');
  good.onclick = () => { bump(q.word.id, true); s.right++; s.i++; renderQuestion(); };
  bad.onclick = () => { bump(q.word.id, false); s.wrong.push(q); if (s.again.length < 8) s.again.push(q); s.i++; renderQuestion(); };
  rate.appendChild(good); rate.appendChild(bad);
  c.appendChild(rate);
  const key = e => {
    if (e.code === 'Space') { e.preventDefault(); if (!shown) f.onclick(); }
    else if (shown && (e.key === '1' || e.key === 'ArrowRight')) good.click();
    else if (shown && (e.key === '2' || e.key === 'ArrowLeft')) bad.click();
  };
  document.addEventListener('keydown', key, { once: false });
  const clean = () => document.removeEventListener('keydown', key);
  good.addEventListener('click', clean); bad.addEventListener('click', clean);
}

/* ---------- results ---------- */
function finish() {
  const s = state;
  const total = s.qs.length;
  const pct = total ? Math.round(100 * s.right / total) : 0;
  const sec = $('#results'); sec.innerHTML = '';

  const c = el('div', 'card');
  c.innerHTML = '<h2>Result</h2><div class="score">' + s.right + '<small> / ' + total + '</small></div>' +
    '<p class="muted">' + pct + '% &middot; ' + MODES.find(m => m.id === s.mode).t + ' &middot; test' + (s.tests.length > 1 ? 's ' : ' ') + rangeText(s.tests) +
    (s.claimed ? ' &middot; including ' + s.claimed + ' you asked to be counted' : '') + '</p>';
  sec.appendChild(c);

  if (s.wrong.length) {
    const w = el('div', 'card');
    let rows = '';
    const seen = new Set();
    s.wrong.forEach(q => {
      const k = q.word.id + (q.form || q.prompt);
      if (seen.has(k)) return; seen.add(k);
      rows += '<tr><td class="lat">' + esc(q.prompt) + '</td><td>' + esc(q.show) + '</td><td class="muted">' + esc(q.word.l) + ' &middot; ' + q.word.test + '</td></tr>';
    });
    w.innerHTML = '<h2>Worth another look</h2><table><thead><tr><th>Question</th><th>Answer</th><th>Word</th></tr></thead><tbody>' + rows + '</tbody></table>';
    const again = el('button', 'btn sm'); again.textContent = 'Test me on just these';
    again.style.marginTop = '14px';
    again.onclick = () => {
      const ws = [...new Set(s.wrong.map(q => q.word))];
      const qs = ws.map(x => (s.mode === 'flash' ? qFlash(x, false) : s.mode === 'e2l' ? e2lQuestion(x, ws) : s.mode === 'forms' ? formsQuestion(x) : qBasic(x))).filter(Boolean);
      state = { qs: shuffle(qs), i: 0, right: 0, wrong: [], tests: s.tests, mode: s.mode, again: [], claimed: 0, pupil: s.pupil };
      show('session'); renderQuestion();
    };
    w.appendChild(again);
    sec.appendChild(w);
  }

  const code = makeCode({ n: s.pupil || '', m: s.mode, t: rangeText(s.tests), s: s.right, q: total, c: s.claimed || 0 });
  const cc = el('div', 'card');
  cc.innerHTML = '<h2>Score code</h2><p class="muted">Send this line to your teacher as proof the prep was done.</p><code class="codebox">' + esc(code) + '</code>';
  const cp = el('button', 'btn ghost sm', 'Copy code'); cp.style.marginTop = '12px';
  cp.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(code); cp.textContent = 'Copied'; };
  cc.appendChild(cp);
  sec.appendChild(cc);

  const nav = el('div');
  const again2 = el('button', 'btn red', 'Another go'); again2.onclick = () => startSession();
  const home = el('button', 'btn ghost', 'Back to the start'); home.style.marginLeft = '10px'; home.onclick = () => show('home');
  nav.appendChild(again2); nav.appendChild(home);
  sec.appendChild(nav);
  show('results');
}

/* ---------- score code ---------- */
function b64(str) { return btoa(unescape(encodeURIComponent(str))).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_'); }
function unb64(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); return decodeURIComponent(escape(atob(str))); }
function sum(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return h.toString(36).slice(0, 4).toUpperCase(); }
function makeCode(o) {
  o.d = new Date().toISOString().slice(0, 10);
  const p = b64(JSON.stringify(o));
  return 'LAT-' + p + '-' + sum(p);
}
function readCode(code) {
  const m = String(code).trim().match(/^LAT-([A-Za-z0-9\-_]+)-([A-Z0-9]{1,4})$/);
  if (!m) return { error: 'That is not a score code.' };
  if (sum(m[1]) !== m[2]) return { error: 'This code has been altered — the checksum does not match.' };
  try { return { data: JSON.parse(unb64(m[1])) }; } catch (e) { return { error: 'This code is damaged.' }; }
}

/* ============================================================
   PRINT SHEET
   ============================================================ */
function initPrint() {
  const sel = $('#pTest'); sel.innerHTML = '';
  TESTS.forEach(t => { const o = el('option', null, 'Test ' + t); o.value = t; sel.appendChild(o); });
  $('#pGen').onclick = buildSheet;
  $('#pPrint').onclick = () => window.print();
  $('#pKey').onclick = () => { const k = $('#sheet').querySelectorAll('.ans'); k.forEach(e => e.classList.toggle('hidden')); };
  buildSheet();
}
function buildSheet() {
  const t = parseInt($('#pTest').value, 10);
  let n = parseInt($('#pCount').value, 10);
  const dir = $('#pDir').value;
  const ratio = parseFloat($('#pInter').value);
  const main = BY_TEST[t] || [];
  if (!n) n = main.length;
  const earlier = WORDS.filter(w => w.test < t);
  const nInter = earlier.length ? Math.round(n * ratio) : 0;
  const items = sample(main, n - nInter).map(w => ({ w, i: false }))
    .concat(sample(earlier, nInter).map(w => ({ w, i: true })));
  const list = shuffle(items);

  let html = '<div class="sheet"><h3>Latin Vocabulary Test ' + t + '</h3>' +
    '<div class="meta">Name: ______________________  &nbsp; Set: __________  &nbsp; Date: __________ &nbsp;&nbsp; Total: ___ / ' + list.length + '</div><ol class="cols">';
  list.forEach(it => {
    const w = it.w;
    let q = '', a = '';
    if (dir === 'le') { q = w.l; a = w.senses.join(', '); }
    else if (dir === 'el') { q = w.senses.join(', '); a = w.l + (w.n && !/indeclinable/i.test(w.n) ? ', ' + w.n : ''); }
    else { q = w.l; a = (w.n && !/indeclinable/i.test(w.n) ? w.n + ' — ' : '') + w.senses.join(', '); }
    html += '<li>' + esc(q) + (it.i ? ' <span class="muted">(rev.)</span>' : '') + ' <span class="ans hidden">&nbsp;&nbsp;' + esc(a) + '</span></li>';
  });
  html += '</ol></div>';
  $('#sheet').innerHTML = html;
}

/* ============================================================
   TEACHER PANEL
   ============================================================ */
function renderTeacher() {
  const sec = $('#teacher'); sec.innerHTML = '';

  const d = el('div', 'card');
  d.innerHTML = '<h2>Check a score code</h2><p class="muted">Paste a pupil\'s code to see what they did. A code that has been edited will fail the check.</p>';
  const inp = el('input'); inp.type = 'text'; inp.placeholder = 'LAT-...'; inp.style.marginTop = '8px';
  const out = el('div'); out.style.marginTop = '12px';
  inp.oninput = () => {
    if (!inp.value.trim()) { out.innerHTML = ''; return; }
    const r = readCode(inp.value);
    if (r.error) { out.innerHTML = '<div class="fb bad">' + esc(r.error) + '</div>'; return; }
    const x = r.data;
    const mn = (MODES.find(m => m.id === x.m) || {}).t || x.m;
    out.innerHTML = '<div class="fb ok"><b>' + esc(x.n || 'No name given') + '</b>' +
      '<span class="alt">' + x.s + ' out of ' + x.q + ' &middot; ' + esc(mn) + ' &middot; test ' + esc(x.t) + ' &middot; ' + esc(x.d) +
      (x.c ? ' &middot; <b>' + x.c + ' self-claimed</b>, see Queried answers' : '') + '</span></div>';
  };
  d.appendChild(inp); d.appendChild(out);
  sec.appendChild(d);

  const qr = el('div', 'card');
  let qHtml = '<h2>Queried answers</h2>';
  if (!store.queries.length) qHtml += '<p class="muted">Nothing queried on this device. When a pupil is marked wrong they can say their version could be right too; the mark is given back and the query lands here for you to check.</p>';
  else {
    qHtml += '<p class="muted">The mark was given back in each case. The score code says how many.</p>' +
      '<table><thead><tr><th>Question</th><th>Pupil put</th><th>Expected</th><th>Word</th><th>Test</th><th>Date</th></tr></thead><tbody>';
    store.queries.slice().reverse().forEach(x => {
      qHtml += '<tr><td>' + esc(x.q) + '</td><td class="lat">' + esc(x.got) + '</td><td>' + esc(x.want) + '</td><td class="muted">' + esc(x.w) + '</td><td>' + x.t + '</td><td class="muted">' + esc(x.d) + '</td></tr>';
    });
    qHtml += '</tbody></table>';
  }
  qr.innerHTML = qHtml;
  if (store.queries.length) {
    const cp = el('button', 'btn ghost sm', 'Copy the list'); cp.style.marginTop = '12px';
    cp.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(store.queries.map(x => x.q + '  |  put: ' + x.got + '  |  expected: ' + x.want + '  |  ' + x.w + ' (test ' + x.t + ')').join('\n')); cp.textContent = 'Copied'; };
    const cl = el('button', 'btn ghost sm', 'Clear'); cl.style.marginTop = '12px'; cl.style.marginLeft = '8px';
    cl.onclick = () => { store.queries = []; save(); renderTeacher(); };
    qr.appendChild(cp); qr.appendChild(cl);
  }
  sec.appendChild(qr);

  const f = el('div', 'card');
  let flagHtml = '<h2>Flagged forms</h2>';
  if (!store.flags.length) flagHtml += '<p class="muted">Nothing flagged on this device. Pupils can flag any generated form that looks wrong; they collect here.</p>';
  else {
    flagHtml += '<table><thead><tr><th>Item</th><th>Word</th><th>Test</th><th>Date</th></tr></thead><tbody>';
    store.flags.slice().reverse().forEach(x => { flagHtml += '<tr><td>' + esc(x.k) + '</td><td class="lat">' + esc(x.w) + '</td><td>' + x.t + '</td><td class="muted">' + esc(x.d) + '</td></tr>'; });
    flagHtml += '</tbody></table>';
  }
  f.innerHTML = flagHtml;
  if (store.flags.length) {
    const cp = el('button', 'btn ghost sm', 'Copy the list'); cp.style.marginTop = '12px';
    cp.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(store.flags.map(x => x.k).join('\n')); cp.textContent = 'Copied'; };
    const cl = el('button', 'btn ghost sm', 'Clear'); cl.style.marginTop = '12px'; cl.style.marginLeft = '8px';
    cl.onclick = () => { store.flags = []; save(); renderTeacher(); };
    f.appendChild(cp); f.appendChild(cl);
  }
  sec.appendChild(f);

  const b = el('div', 'card');
  b.innerHTML = '<h2>Browse the list</h2>';
  const sel = el('select');
  TESTS.forEach(t => { const o = el('option', null, 'Test ' + t); o.value = t; sel.appendChild(o); });
  const tbl = el('div'); tbl.style.marginTop = '12px';
  const draw = () => {
    const ws = BY_TEST[sel.value] || [];
    let h = '<table><thead><tr><th>Latin</th><th>Parts</th><th>Part of speech</th><th>Meanings</th></tr></thead><tbody>';
    ws.forEach(w => { h += '<tr><td class="lat">' + esc(w.l) + '</td><td class="muted">' + esc(w.n) + '</td><td class="muted">' + esc(w.p) + '</td><td>' + esc(w.m) + '</td></tr>'; });
    tbl.innerHTML = h + '</tbody></table>';
  };
  sel.onchange = draw; draw();
  b.appendChild(sel); b.appendChild(tbl);
  sec.appendChild(b);

  const r = el('div', 'card');
  r.innerHTML = '<h2>This device</h2><p class="muted">Progress, flags and queries are kept in this browser only. Nothing is sent anywhere.</p>';
  const wipe = el('button', 'btn ghost sm', 'Clear everything on this device');
  wipe.onclick = () => { if (confirm('Clear all progress, flags and queries on this device?')) { store = { stats: {}, flags: [], queries: [], settings: {}, done: {} }; save(); renderTeacher(); renderChips(); } };
  r.appendChild(wipe);
  sec.appendChild(r);

  show('teacher');
}

/* ============================================================
   BOOT
   ============================================================ */
if (store.settings.count) $('#qCount').value = store.settings.count;
if (store.settings.inter) $('#interleave').value = store.settings.inter;
if (store.settings.pupil) $('#pupil').value = store.settings.pupil;

renderChips(); renderModes(); updateInfo(); initPrint();

$('#start').onclick = startSession;
$('#quit').onclick = finish;
$('#navHome').onclick = () => show('home');
$('#navPrint').onclick = () => show('print');
$('#navTeacher').onclick = renderTeacher;
$('#selOne').onclick = () => { const t = Math.max.apply(null, [...selected]); selected = new Set([t]); renderChips(); updateInfo(); };
$('#selCumulative').onclick = () => { const t = Math.max.apply(null, [...selected]); selected = new Set(TESTS.filter(x => x <= t)); renderChips(); updateInfo(); };
$('#selAll').onclick = () => { selected = new Set(TESTS); renderChips(); updateInfo(); };
$('#qCount').onchange = updateInfo; $('#interleave').onchange = updateInfo;

if (location.search.indexOf('debug') >= 0) window.__t = { WORDS, MODES, buildQuestions, formsQuestion, e2lQuestion, poolFor, readCode, makeCode, checkAllMeanings, checkWords };

})();
